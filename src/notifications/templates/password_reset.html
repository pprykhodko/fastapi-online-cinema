<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — Online Cinema</title>
</head>
<body>
    <h1>Reset your password</h1>
    <p>Use at least 8 characters, uppercase and lowercase letters, a number and a special character (@$!%*?&amp;#).</p>
    <form id="reset-form" hidden>
        <label>New password <input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <button type="submit">Save password</button>
    </form>
    <p id="message" role="status"></p>
    <noscript>Enable JavaScript to submit this form, or send the token and new_password to POST /api/v1/accounts/password/reset/.</noscript>
    <script nonce="{{ nonce }}">
        const token = new URLSearchParams(window.location.hash.slice(1)).get("token");
        history.replaceState(null, "", window.location.pathname);
        const form = document.getElementById("reset-form");
        const message = document.getElementById("message");
        const password = document.getElementById("password");
        const button = form.querySelector("button");
        form.hidden = !token;
        if (!token) message.textContent = "Missing reset token. Please request a new email.";

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            button.disabled = true;
            message.textContent = "Saving...";
            try {
                const response = await fetch("/api/v1/accounts/password/reset/", {
                    method: "POST",
                    credentials: "omit",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({token, new_password: password.value})
                });
                const data = await response.json();
                if (response.ok) {
                    form.hidden = true;
                    password.value = "";
                    message.textContent = "Password updated. You can log in with your new password and close this page.";
                } else {
                    message.textContent = Array.isArray(data.detail)
                        ? data.detail.map(item => item.msg).join(" ")
                        : (data.detail || "Password could not be changed. Please try again.");
                }
            } catch {
                message.textContent = "Server unavailable. Please try again.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
