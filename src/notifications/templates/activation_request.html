<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Account activation</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; padding: 20px;">
    <h2>Welcome to Online Cinema!</h2>
    <p>An account was registered using <strong>{{ email }}</strong>.</p>
    <p><a href="{{ activation_link }}">Activate your account</a></p>
    <p>This link expires at {{ expires_at }}.</p>
    <p>If you did not register, please ignore this email.</p>
    <p>The Online Cinema team</p>
</body>
</html>
