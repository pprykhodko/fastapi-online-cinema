<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Password reset</title>
</head>
<body>
    <h2>Reset your Online Cinema password</h2>
    <p>A password reset was requested for {{ email }}.</p>
    <p><a href="{{ reset_link }}">Choose a new password</a></p>
    <p>This link expires at {{ expires_at }} and can be used only once.</p>
    <p>If you did not request a reset, ignore this email.</p>
</body>
</html>
