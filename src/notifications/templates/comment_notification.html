<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Comment notification</title></head>
<body style="margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#1f2937;">
  <div style="max-width:560px;margin:32px auto;padding:28px;background:#fff;border-radius:12px;">
    <p style="color:#6366f1;font-weight:bold;">ONLINE CINEMA</p>
    <h2>New activity on your comment</h2>
    <p>Your comment #{{ comment_id }} on <strong>{{ movie_name }}</strong> {{ action }}.</p>
    <p style="color:#6b7280;">Open the movie's comments to view the discussion.</p>
  </div>
</body>
</html>
